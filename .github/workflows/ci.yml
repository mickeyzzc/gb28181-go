name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Vet (gb35114)
        run: go vet -tags gb35114 ./...
      - name: Test (gb35114)
        run: go test -race -tags gb35114 ./...
      - name: Format check
        run: test -z "$(gofmt -l .)"
