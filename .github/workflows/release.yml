name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Test (tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Vet (gb35114)
        run: go vet -tags gb35114 ./...
      - name: Test (gb35114)
        run: go test -race -tags gb35114 ./...
      - name: Format check
        run: test -z "$(gofmt -l .)"

  tools:
    name: Build tools (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build example bundle
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          # Whole-library compile first: the examples only cover their own
          # dependency closure, this catches platform-specific code
          # anywhere in the module.
          go build ./...
          mkdir -p dist
          ext=""
          archive="gb28181-go-tools_${GOOS}_${GOARCH}.tar.gz"
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
            archive="gb28181-go-tools_${GOOS}_${GOARCH}.zip"
          fi
          # The examples double as interop tools: a GB28181 device
          # emulator, a platform-side UAS, and an RTP/PS mux tester.
          for cmd in device-register platform-uas psmux-rtp; do
            go build -trimpath -o "dist/${cmd}${ext}" "./examples/${cmd}"
          done
          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -q "../${archive}" ./*)
          else
            (cd dist && tar -czf "../${archive}" ./*)
          fi
          rm -rf dist && mkdir dist && mv "${archive}" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    name: GitHub Release
    needs: [test, tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
